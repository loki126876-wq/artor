name: Hermes Autonomous Sandbox (6 Hours)

on:
  workflow_dispatch:

jobs:
  agent-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # سقف ۶ ساعت گیت‌هاب

    steps:
      - name: Deploy Hermes API Server & Cloudflare
        run: |
          set -e

          echo "=== 1. Preparing Full Root Environment ==="
          # نصب کلودفلر و ttyd برای مانیتورینگ شما
          sudo curl -sLo /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

          sudo curl -sLo /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd

          # رمز عبور و توکن امنیتی اختصاصی برای هرمس
          AUTH_TOKEN=$(openssl rand -hex 12)
          UI_PASSWORD=$(openssl rand -hex 4)

          echo "=== 2. Creating Lightweight Command API for Hermes ==="
          # ساخت یک سرور HTTP سبک که دستورات ایجنت را مستقیماً در بش با دسترسی root اجرا می‌کند
          cat << 'EOF' > /tmp/agent_api.py
          import http.server, subprocess, json, sys

          TOKEN = sys.argv[1]
          PORT = int(sys.argv[2])

          class AgentHandler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  auth = self.headers.get('Authorization', '')
                  if auth != f"Bearer {TOKEN}":
                      self.send_response(401)
                      self.end_headers()
                      self.wfile.write(b'{"error": "Unauthorized"}')
                      return
                  
                  length = int(self.headers.get('Content-Length', 0))
                  req = json.loads(self.rfile.read(length).decode('utf-8'))
                  cmd = req.get('cmd', '')

                  try:
                      # اجرای دستور در پوشه روت سیستم
                      res = subprocess.run(cmd, shell=True, capture_output=True, text=True, cwd="/root", timeout=300)
                      resp = {
                          "stdout": res.stdout,
                          "stderr": res.stderr,
                          "exit_code": res.returncode
                      }
                  except Exception as e:
                      resp = {"error": str(e), "exit_code": -1}

                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps(resp).encode('utf-8'))

              def log_message(self, format, *args):
                  pass # جلوگیری از اسپم شدن لاگ

          server = http.server.ThreadingHTTPServer(('127.0.0.1', PORT), AgentHandler)
          server.serve_forever()
          EOF

          # اجرای سرور API برای هرمس روی پورت 8080 به صورت روت
          sudo nohup python3 /tmp/agent_api.py "$AUTH_TOKEN" 8080 > /dev/null 2>&1 &

          # اجرای ترمینال تحت وب روی پورت 7681 برای مشاهده زنده شما
          sudo nohup ttyd -p 7681 -c "root:$UI_PASSWORD" -W bash > /dev/null 2>&1 &

          echo "=== 3. Launching Cloudflare Tunnels ==="
          # تانل برای API هرمس
          cloudflared tunnel --url http://127.0.0.1:8080 > /tmp/api_tunnel.log 2>&1 &
          # تانل برای مشاهده شما در مرورگر
          cloudflared tunnel --url http://127.0.0.1:7681 > /tmp/ui_tunnel.log 2>&1 &

          sleep 7
          API_URL=""
          UI_URL=""
          for i in {1..30}; do
            API_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' /tmp/api_tunnel.log | head -n 1 || true)
            UI_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' /tmp/ui_tunnel.log | head -n 1 || true)
            if [ -n "$API_URL" ] && [ -n "$UI_URL" ]; then
              break
            fi
            sleep 2
          done

          echo ""
          echo "================================================================="
          echo "           🤖 HERMES AGENT ENVIRONMENT IS LIVE (6 HOURS)         "
          echo "================================================================="
          echo "🎯 HERMES API ENDPOINT : $API_URL/exec"
          echo "🔑 HERMES AUTH TOKEN   : $AUTH_TOKEN"
          echo "-----------------------------------------------------------------"
          echo "🖥️ HUMAN MONITORING UI : $UI_URL"
          echo "👤 User: root | Password: $UI_PASSWORD"
          echo "================================================================="
          echo ""

          # باز نگه داشتن سشن برای ۶ ساعت (۲۱۶۰۰ ثانیه)
          echo "Sandbox active for 6 hours..."
          sleep 21600
